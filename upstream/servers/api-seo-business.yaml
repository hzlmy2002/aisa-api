# L0: a plain API mapping, one tool per operation. Adding or dropping an
# endpoint is an edit here, never a code change.
#
# One of twelve servers splitting DataForSEO's 445 operations by the question
# they answer. A single server was never an option - CASEBOOK D4: 445 tools in
# one endpoint is a menu no agent can choose from.
#
# ⚠️ Two conventions apply across all twelve, decided 2026-08-25:
#
# 1. ASYNC IS COLLAPSED. DataForSEO offers most operations as a three-call
#    dance: task_post queues, tasks_ready lists what finished, task_get
#    retrieves. Where a `_live` variant exists the async twin is dropped
#    entirely; where it does not, the pair is submit + fetch and `tasks_ready`
#    is withheld. A caller that submitted a job holds its own id, so listing
#    everyone's finished jobs answers a question no single caller is asking.
#    This mirrors the firecrawl and exa job pairs already in `web-search`.
#    445 operations become 317 tools this way.
#
# 2. VENDORS ARE MIXED BY QUESTION. Semrush and Ahrefs used to sit together in
#    a server called `seo`; their 21 tools are redistributed here by what they
#    answer, so an agent asking about domain authority sees that DataForSEO,
#    Semrush and Ahrefs all have a number for it and can cross-refer between
#    them. Same reasoning that put Semrush and Ahrefs together in the first
#    place, carried one step further.

id:    aisa-seo-business
slug:  seo-business
tier:  L0
kind:  atomic
owner: jony
name:  AIsa Business Listings & Reviews
category: SEO & Search Data
description: >
  Local and reputation data through AIsa: Google Business Profile info and
  updates, reviews and Q&A, hotel info and searches, business listing
  search, and Tripadvisor and Trustpilot reviews.

include:
  - spec: dataforseo.json
    operations:
      - get_dataforseo_business_google_extended_reviews_fetch
      - get_dataforseo_business_google_gmb_updates_fetch
      - get_dataforseo_business_google_reviews_fetch
      - get_dataforseo_business_tripadvisor_reviews_fetch
      - get_dataforseo_business_tripadvisor_search_fetch
      - get_dataforseo_business_trustpilot_reviews_fetch
      - get_dataforseo_business_trustpilot_search_fetch
      - post_dataforseo_business_google_extended_reviews_submit
      - post_dataforseo_business_google_gmb_info_live
      - post_dataforseo_business_google_gmb_updates_submit
      - post_dataforseo_business_google_hotel_info_live
      - post_dataforseo_business_google_hotel_info_live_html
      - post_dataforseo_business_google_hotel_searches_live
      - post_dataforseo_business_google_qa_live
      - post_dataforseo_business_google_reviews_submit
      - post_dataforseo_business_listings_search_live
      - post_dataforseo_business_social_media_pinterest_live
      - post_dataforseo_business_social_media_reddit_live
      - post_dataforseo_business_tripadvisor_reviews_submit
      - post_dataforseo_business_tripadvisor_search_submit
      - post_dataforseo_business_trustpilot_reviews_submit
      - post_dataforseo_business_trustpilot_search_submit
