# L0: a plain API mapping, one tool per operation. Adding or dropping an
# endpoint is an edit here, never a code change.
#
# One of twelve servers splitting DataForSEO's 445 operations by the question
# they answer. A single server was never an option - CASEBOOK D4: 445 tools in
# one endpoint is a menu no agent can choose from.
#
# ⚠️ Two conventions apply across all twelve, decided 2026-08-25:
#
# 1. ASYNC IS COLLAPSED. DataForSEO offers most operations as a three-call
#    dance: task_post queues, tasks_ready lists what finished, task_get
#    retrieves. Where a `_live` variant exists the async twin is dropped
#    entirely; where it does not, the pair is submit + fetch and `tasks_ready`
#    is withheld. A caller that submitted a job holds its own id, so listing
#    everyone's finished jobs answers a question no single caller is asking.
#    This mirrors the firecrawl and exa job pairs already in `web-search`.
#    445 operations become 317 tools this way.
#
# 2. VENDORS ARE MIXED BY QUESTION. Semrush and Ahrefs used to sit together in
#    a server called `seo`; their 21 tools are redistributed here by what they
#    answer, so an agent asking about domain authority sees that DataForSEO,
#    Semrush and Ahrefs all have a number for it and can cross-refer between
#    them. Same reasoning that put Semrush and Ahrefs together in the first
#    place, carried one step further.

id:    aisa-seo-backlinks
slug:  seo-backlinks
tier:  L0
kind:  atomic
owner: jony
name:  AIsa Backlinks
category: SEO & Search Data
description: >
  Backlink profiles through AIsa: referring domains and networks, anchors,
  new and lost links over time, competitor and intersection analysis, and
  bulk metrics - from DataForSEO and Semrush.

include:
  - spec: dataforseo.json
    operations:
      - get_dataforseo_backlinks_index
      - post_dataforseo_backlinks_anchors_live
      - post_dataforseo_backlinks_backlinks_live
      - post_dataforseo_backlinks_bulk_backlinks_live
      - post_dataforseo_backlinks_bulk_new_lost_backlinks_live
      - post_dataforseo_backlinks_bulk_new_lost_ref_domains_live
      - post_dataforseo_backlinks_bulk_pages_summary_live
      - post_dataforseo_backlinks_bulk_ranks_live
      - post_dataforseo_backlinks_bulk_referring_domains_live
      - post_dataforseo_backlinks_bulk_spam_score_live
      - post_dataforseo_backlinks_competitors_live
      - post_dataforseo_backlinks_domain_intersection_live
      - post_dataforseo_backlinks_domain_pages_live
      - post_dataforseo_backlinks_domain_pages_summary_live
      - post_dataforseo_backlinks_history_live
      - post_dataforseo_backlinks_page_intersection_live
      - post_dataforseo_backlinks_referring_domains_live
      - post_dataforseo_backlinks_referring_networks_live
      - post_dataforseo_backlinks_summary_live
      - post_dataforseo_backlinks_timeseries_new_lost_live
      - post_dataforseo_backlinks_timeseries_summary_live
  - spec: semrush.json
    operations:
      - get_semrush_backlink_anchors
      - get_semrush_backlink_competitors
      - get_semrush_backlinks
      - get_semrush_backlinks_overview
      - get_semrush_indexed_pages
      - get_semrush_referring_domains
