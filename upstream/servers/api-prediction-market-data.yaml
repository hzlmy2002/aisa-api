# L0: a plain API mapping. Two venues (Polymarket, on-chain; Kalshi, CFTC-
# regulated) share one server because an agent arrives with one question —
# how likely is this — and each venue cross-checks the other.
# That is also why these five descriptions have to name each other; see
# mcp/node.md section 19.3.
id:    aisa-prediction-market-data   # always "aisa-" + slug, checked in CI
slug:  prediction-market-data        # decides the public URL; matches the published manifest; frozen
tier:  L0
kind:  atomic
owner: jony
name:  AIsa Prediction Market Data
category: Finance
description: >
  Live prediction-market data from Polymarket and Kalshi: market-implied
  probabilities, topic-level events, one wallet's on-chain history, and the
  executed-trade tape — two venues for the same questions, so prices can be
  cross-checked against each other.

include:
  - spec: polymarket-openapi.json
    operations: "*"                  # three: markets / events / activity
  - spec: kalshi-openapi.json
    operations: "*"                  # two: markets / trades
  # matching-markets-openapi.json is left out on purpose: its paths are empty,
  # so including it would only add one more fetch at build time
