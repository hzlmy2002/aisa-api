# L0: a plain API mapping, one tool per operation. Adding or dropping an
# endpoint is an edit here, never a code change.
#
# One of twelve servers splitting DataForSEO's 445 operations by the question
# they answer. A single server was never an option - CASEBOOK D4: 445 tools in
# one endpoint is a menu no agent can choose from.
#
# ⚠️ Two conventions apply across all twelve, decided 2026-08-25:
#
# 1. ASYNC IS COLLAPSED. DataForSEO offers most operations as a three-call
#    dance: task_post queues, tasks_ready lists what finished, task_get
#    retrieves. Where a `_live` variant exists the async twin is dropped
#    entirely; where it does not, the pair is submit + fetch and `tasks_ready`
#    is withheld. A caller that submitted a job holds its own id, so listing
#    everyone's finished jobs answers a question no single caller is asking.
#    This mirrors the firecrawl and exa job pairs already in `web-search`.
#    445 operations become 317 tools this way.
#
# 2. VENDORS ARE MIXED BY QUESTION. Semrush and Ahrefs used to sit together in
#    a server called `seo`; their 21 tools are redistributed here by what they
#    answer, so an agent asking about domain authority sees that DataForSEO,
#    Semrush and Ahrefs all have a number for it and can cross-refer between
#    them. Same reasoning that put Semrush and Ahrefs together in the first
#    place, carried one step further.

id:    aisa-seo-merchant
slug:  seo-merchant
tier:  L0
kind:  atomic
owner: jony
name:  AIsa Shopping & Marketplace
category: SEO & Search Data
description: >
  Product data from Amazon and Google Shopping through AIsa: product
  listings and details, sellers, reviews, and shopping search results.

include:
  # get_dataforseo_merchant_google_sellers_ad_url is excluded: the spec declares
  # no parameters for it and calling it as written answers 40400 Not Found with a
  # null tasks array. Same rule as get_coingecko_news - an endpoint that always
  # fails is worse than an absent one (CASEBOOK C1).
  - spec: dataforseo.json
    operations:
      - get_dataforseo_merchant_amazon_asin_fetch
      - get_dataforseo_merchant_amazon_asin_fetch_html
      - get_dataforseo_merchant_amazon_languages
      - get_dataforseo_merchant_amazon_locations
      - get_dataforseo_merchant_amazon_products_fetch
      - get_dataforseo_merchant_amazon_products_fetch_html
      - get_dataforseo_merchant_amazon_sellers_fetch
      - get_dataforseo_merchant_amazon_sellers_fetch_html
      - get_dataforseo_merchant_google_languages
      - get_dataforseo_merchant_google_locations
      - get_dataforseo_merchant_google_product_info_fetch
      - get_dataforseo_merchant_google_products_fetch
      - get_dataforseo_merchant_google_products_fetch_html
      - get_dataforseo_merchant_google_reviews_fetch
      - get_dataforseo_merchant_google_sellers_fetch
      - post_dataforseo_merchant_amazon_asin_submit
      - post_dataforseo_merchant_amazon_products_submit
      - post_dataforseo_merchant_amazon_sellers_submit
      - post_dataforseo_merchant_google_product_info_submit
      - post_dataforseo_merchant_google_products_submit
      - post_dataforseo_merchant_google_reviews_submit
      - post_dataforseo_merchant_google_sellers_submit
