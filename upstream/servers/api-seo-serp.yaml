# L0: a plain API mapping, one tool per operation. Adding or dropping an
# endpoint is an edit here, never a code change.
#
# One of twelve servers splitting DataForSEO's 445 operations by the question
# they answer. A single server was never an option - CASEBOOK D4: 445 tools in
# one endpoint is a menu no agent can choose from.
#
# ⚠️ Two conventions apply across all twelve, decided 2026-08-25:
#
# 1. ASYNC IS COLLAPSED. DataForSEO offers most operations as a three-call
#    dance: task_post queues, tasks_ready lists what finished, task_get
#    retrieves. Where a `_live` variant exists the async twin is dropped
#    entirely; where it does not, the pair is submit + fetch and `tasks_ready`
#    is withheld. A caller that submitted a job holds its own id, so listing
#    everyone's finished jobs answers a question no single caller is asking.
#    This mirrors the firecrawl and exa job pairs already in `web-search`.
#    445 operations become 317 tools this way.
#
# 2. VENDORS ARE MIXED BY QUESTION. Semrush and Ahrefs used to sit together in
#    a server called `seo`; their 21 tools are redistributed here by what they
#    answer, so an agent asking about domain authority sees that DataForSEO,
#    Semrush and Ahrefs all have a number for it and can cross-refer between
#    them. Same reasoning that put Semrush and Ahrefs together in the first
#    place, carried one step further.

id:    aisa-seo-serp
slug:  seo-serp
tier:  L0
kind:  atomic
owner: jony
name:  AIsa SERP - Google
category: SEO & Search Data
description: >
  Google search results through AIsa: organic and paid listings, local
  finder, images, news, maps, jobs, shopping, finance, autocomplete and the
  AI overview, plus Semrush's ranked organic and paid results for the same
  query.

include:
  - spec: dataforseo.json
    operations:
      - get_dataforseo_serp_gads_advertisers_locations
      - get_dataforseo_serp_gads_search_locations
      - get_dataforseo_serp_google_ai_mode_languages
      - get_dataforseo_serp_google_events_locations
      - get_dataforseo_serp_google_jobs_fetch
      - get_dataforseo_serp_google_jobs_fetch_html
      - get_dataforseo_serp_google_jobs_locations
      - get_dataforseo_serp_google_search_by_image_fetch
      - get_dataforseo_serp_google_search_by_image_fetch_html
      - post_dataforseo_serp_gads_advertisers_live
      - post_dataforseo_serp_gads_search_live
      - post_dataforseo_serp_google_ai_mode_live
      - post_dataforseo_serp_google_ai_mode_live_html
      - post_dataforseo_serp_google_autocomplete_live
      - post_dataforseo_serp_google_dataset_info_live
      - post_dataforseo_serp_google_dataset_search_live
      - post_dataforseo_serp_google_events_live
      - post_dataforseo_serp_google_finance_explore_live
      - post_dataforseo_serp_google_finance_explore_live_html
      - post_dataforseo_serp_google_finance_markets_live
      - post_dataforseo_serp_google_finance_markets_live_html
      - post_dataforseo_serp_google_finance_quote_live
      - post_dataforseo_serp_google_finance_quote_live_html
      - post_dataforseo_serp_google_finance_ticker_search_live
      - post_dataforseo_serp_google_images_live
      - post_dataforseo_serp_google_images_live_html
      - post_dataforseo_serp_google_jobs_submit
      - post_dataforseo_serp_google_local_finder_live
      - post_dataforseo_serp_google_local_finder_live_html
      - post_dataforseo_serp_google_maps_live
      - post_dataforseo_serp_google_news_live
      - post_dataforseo_serp_google_news_live_html
