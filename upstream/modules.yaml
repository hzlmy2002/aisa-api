# Modules: how the root entry point (mcp.aisa.one/mcp) groups tools.
#
# A module is a named set of servers. Two kinds exist and both resolve through
# `?modules=<a>,<b>` on the root entry point:
#
#   * every server slug is implicitly a module of its own (`seo-backlinks`,
#     `twitter-api`, ...) — nothing to declare here;
#   * the categories below are coarse modules spanning several servers, and each
#     of them is also served at its own path alias, `mcp.aisa.one/<category>/mcp`,
#     which is the same thing as `mcp.aisa.one/mcp?modules=<category>`.
#
# Modules decide what is PRELOADED into a client's tools/list. They never
# decide what is REACHABLE: the root's search_tools / call_tool pair reaches
# every tool on every server regardless of what was pinned. And they never
# touch billing — that is decided per call, per key, by /apis/v1.
#
# Keep a server in exactly one category. Overlap makes "which module owns this
# tool" unanswerable, and the catalogue entries, the telemetry and the package
# definitions all key on that answer.
# The `seo` category preloads `default_tools` — a curated set of about sixty —
# rather than all 316; `?modules=seo-all` pins everything. The fine `seo-*`
# modules below regroup DataForSEO Labs operations by the question they
# answer: App Store keyword research joins seo-apps, Amazon joins
# seo-marketplace, and the rest of Labs is keywords or competitors.
