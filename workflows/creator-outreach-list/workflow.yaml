name: creator_outreach_list
title: Find similar creators and build a contact list
description: Discover creators from a seed profile or content brief, then fill
  missing contact data and produce a traceable shortlist.
arguments:
  - name: brief
    description: Seed creator profile URL or content direction, target platform, and
      any audience filters.
    required: true
skill:
  when_to_use: Find similar YouTube or TikTok creators, research influencers, look
    up creator emails, or build a KOL outreach shortlist from a profile or
    campaign brief.
    达人拓展、相似博主、网红名单、创作者邮箱、KOL联系表、YouTube和TikTok达人发现、Instagram邮箱查询。
  aliases:
    - influencer prospecting
    - creator contact list
    - 达人名单
  tags:
    - sales
    - creators
  providers:
    - waveinflu
  examples:
    - Find ten creators similar to this YouTube channel and their contact emails.
uses:
  - post_waveinflu_similar_creators
  - post_waveinflu_email_lookup
template: >-
  Brief: {brief}


  1. Read [discovery rules](references/discovery.md) to resolve the seed, target
  platform, filters and call budget.

  2. Read only the needed operation contract: use
  `post_waveinflu_similar_creators` for discovery and
  `post_waveinflu_email_lookup` for contact-only requests or missing emails.
  Preserve emails already returned by discovery; do not pay to retrieve the same
  data again unless fresh verification was requested.

  3. Deduplicate and keep provider similarity order. Batch independent
  missing-email lookups within the chosen shortlist.

  4. Read [report format](references/report.md) when preparing the deliverable.
  Report missing contacts and failed lookups separately. Stop at the requested
  shortlist; collecting contacts does not authorize outreach.
references:
  - discovery.md
  - report.md
